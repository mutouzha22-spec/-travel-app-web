<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="travel_app">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>travel_app</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <audio id="travel-bgm" preload="auto" loop src="assets/assets/Kawaii_AI_song.mp3" hidden></audio>
  <audio id="travel-type-1" preload="auto" src="assets/assets/audio/monkey_type_mobile_1.wav" hidden></audio>
  <audio id="travel-type-2" preload="auto" src="assets/assets/audio/monkey_type_mobile_2.wav" hidden></audio>
  <audio id="travel-type-3" preload="auto" src="assets/assets/audio/monkey_type_mobile_3.wav" hidden></audio>
  <script>
    (() => {
      const music = document.getElementById('travel-bgm');
      const typeSounds = [1, 2, 3].map((index) =>
        document.getElementById(`travel-type-${index}`)
      );
      let unlocked = false;

      music.volume = 0.16;
      typeSounds.forEach((sound) => sound.volume = 0.78);

      const safePlay = (audio) => {
        const result = audio.play();
        if (result) {
          result.catch((error) => {
            document.documentElement.dataset.audioError = error.name;
          });
        }
      };

      const unlockAudio = () => {
        document.documentElement.dataset.audioUnlocked = 'true';
        if (!unlocked) {
          unlocked = true;
          typeSounds.forEach((sound) => {
            sound.currentTime = 0;
            sound.volume = 0.01;
            sound.addEventListener('ended', () => sound.volume = 0.78, {
              once: true,
            });
            safePlay(sound);
          });
        }
        safePlay(music);
      };

      ['pointerdown', 'touchstart', 'click', 'keydown'].forEach((eventName) => {
        document.addEventListener(eventName, unlockAudio, {
          capture: true,
          passive: true,
        });
      });
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
          music.pause();
        } else if (unlocked) {
          safePlay(music);
        }
      });
    })();
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
